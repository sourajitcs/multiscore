[build-system]
requires = ["setuptools>=64", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "multiscore"
version = "0.1.0"
description = "MULTI-SCORE: zero-shot multimodal retrieval with multi-scale contextual representations"
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [
    { name = "Sourajit Saha" },
    { name = "Tejas Gokhale" },
]
keywords = [
    "multimodal retrieval",
    "information retrieval",
    "matryoshka representation learning",
    "zero-shot",
    "re-ranking",
    "multimodal large language models",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = [
    "numpy>=1.23",
    "pyyaml>=6.0",
    "tqdm>=4.64",
]

[project.optional-dependencies]
# Everything needed to run the real Qwen backbones.
models = [
    "torch>=2.1",
    "transformers>=4.51",
    "accelerate>=0.30",
    "pillow>=9.0",
    "librosa>=0.10",
    "soundfile>=0.12",
    "av>=11.0",
]
dev = [
    "pytest>=7.0",
    "pytest-cov>=4.0",
    "ruff>=0.4",
    "black>=24.0",
]

[project.urls]
Homepage = "https://sourajitcs.github.io/multiscore/"
Repository = "https://github.com/sourajitcs/multiscore"

[project.scripts]
multiscore-caption = "scripts.preprocess_caption:main"
multiscore-index = "scripts.build_index:main"
multiscore-retrieve = "scripts.run_retrieval:main"
multiscore-evaluate = "scripts.evaluate:main"

[tool.setuptools.packages.find]
include = ["multiscore*", "scripts*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.black]
line-length = 100
target-version = ["py39"]

[tool.ruff]
line-length = 100
target-version = "py39"

[tool.ruff.lint]
select = ["E", "F", "I", "W"]
ignore = ["E501"]
